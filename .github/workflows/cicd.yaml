name: Calculator CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: utkal1990/python-calculator
  CONTAINER_NAME: python-calculator
  APP_PORT: 5000

jobs:

  # ============================================================
  # CI - TEST
  # ============================================================

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  # ============================================================
  # CI - BUILD & PUSH DOCKER IMAGE
  # ============================================================

  docker:
    name: Build and Push Docker Image

    needs: test

    # Do not build/push for pull requests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  # ============================================================
  # CD - DEPLOY TO GCP DOCKER SERVER
  # ============================================================

  deploy:
    name: Deploy to GCP Docker Server

    needs: docker

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # This is your self-hosted runner
    runs-on: self-hosted

    steps:

      - name: Show deployment server
        run: |
          echo "======================================"
          echo " Deployment Server"
          echo "======================================"
          echo "Hostname:"
          hostname
          echo ""
          echo "User:"
          whoami
          echo ""
          echo "Docker:"
          docker --version


      - name: Verify Docker
        run: |
          docker info


      - name: Pull Docker image
        run: |
          echo "Pulling:"
          echo "$IMAGE_NAME:${{ github.sha }}"

          docker pull \
            $IMAGE_NAME:${{ github.sha }}


      - name: Stop old container
        run: |
          echo "Stopping old container..."

          docker stop \
            $CONTAINER_NAME 2>/dev/null || true


      - name: Remove old container
        run: |
          echo "Removing old container..."

          docker rm \
            $CONTAINER_NAME 2>/dev/null || true


      - name: Start new container
        run: |
          echo "Starting new container..."

          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p $APP_PORT:$APP_PORT \
            $IMAGE_NAME:${{ github.sha }}


      - name: Wait for application
        run: |
          echo "Waiting for application..."
          sleep 5


      - name: Verify container
        run: |
          echo "======================================"
          echo " Running Container"
          echo "======================================"

          docker ps \
            --filter "name=$CONTAINER_NAME"


      - name: Show logs
        run: |
          echo "======================================"
          echo " Application Logs"
          echo "======================================"

          docker logs \
            --tail 50 \
            $CONTAINER_NAME


      - name: Health check
        run: |
          echo "Checking application..."

          curl \
            --fail \
            --retry 10 \
            --retry-delay 2 \
            --connect-timeout 5 \
            http://localhost:$APP_PORT/health

          echo ""
          echo "======================================"
          echo " APPLICATION DEPLOYED SUCCESSFULLY"
          echo "======================================"


      - name: Show deployment information
        run: |
          echo "======================================"
          echo " Deployment Details Change"
          echo "======================================"

          echo "Image:"
          docker inspect \
            $CONTAINER_NAME \
            --format='{{.Config.Image}}'

          echo ""
          echo "Port:"
          docker port $CONTAINER_NAME

          echo ""
          echo "Container:"
          docker ps --filter "name=$CONTAINER_NAME"
