name: Calculator CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  IMAGE_NAME: utkal1990/python-calculator
  CONTAINER_NAME: python-calculator
  APP_PORT: 5000


jobs:

  # ============================================================
  # CI - RUN PYTHON TESTS
  # ============================================================

  test:
    name: Run Python Tests

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Run unit tests
      # --------------------------------------------------------

      - name: Run tests
        run: |
          pytest


  # ============================================================
  # CI - BUILD & PUSH DOCKER IMAGE
  # ============================================================

  docker:
    name: Build and Push Docker Image

    needs: test

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # Generate immutable image tag
      # --------------------------------------------------------

      - name: Generate image tag
        id: meta

        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          echo "Image tag:"
          echo "${GITHUB_SHA::7}"


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${GITHUB_SHA::7} \
            -t $IMAGE_NAME:latest \
            .


      # --------------------------------------------------------
      # Push immutable SHA image
      # --------------------------------------------------------

      - name: Push SHA image
        run: |
          docker push \
            $IMAGE_NAME:${GITHUB_SHA::7}


      # --------------------------------------------------------
      # Push latest image
      # --------------------------------------------------------

      - name: Push latest image
        run: |
          docker push \
            $IMAGE_NAME:latest


  # ============================================================
  # CD - DEPLOY DOCKER CONTAINER TO KUBEMASTER
  # ============================================================

  deploy:
    name: Deploy Docker Container to Master

    needs: docker

    # ----------------------------------------------------------
    # Self-hosted runner is installed on kubemaster
    # ----------------------------------------------------------

    runs-on: self-hosted

    # ----------------------------------------------------------
    # Deploy only for pushes to main
    # ----------------------------------------------------------

    if: github.event_name == 'push'

    steps:

      # --------------------------------------------------------
      # Display deployment information
      # --------------------------------------------------------

      - name: Deployment information
        run: |
          echo "=========================================="
          echo " Docker Deployment"
          echo "=========================================="

          echo "Host:"
          hostname

          echo ""

          echo "Docker version:"
          docker --version

          echo ""

          echo "Kubernetes master:"
          hostname -f


      # --------------------------------------------------------
      # Verify Docker service
      # --------------------------------------------------------

      - name: Verify Docker
        run: |
          docker info


      # --------------------------------------------------------
      # Pull new image from Docker Hub
      # --------------------------------------------------------

      - name: Pull Docker image
        run: |
          echo "Pulling image:"
          echo "$IMAGE_NAME:${{ needs.docker.outputs.image_tag }}"

          docker pull \
            $IMAGE_NAME:${{ needs.docker.outputs.image_tag }}


      # --------------------------------------------------------
      # Stop existing container
      # --------------------------------------------------------

      - name: Stop old container
        run: |
          echo "Stopping existing container..."

          docker stop $CONTAINER_NAME 2>/dev/null || true


      # --------------------------------------------------------
      # Remove existing container
      # --------------------------------------------------------

      - name: Remove old container
        run: |
          echo "Removing existing container..."

          docker rm $CONTAINER_NAME 2>/dev/null || true


      # --------------------------------------------------------
      # Start new container
      # --------------------------------------------------------

      - name: Start new container
        run: |
          echo "Starting new container..."

          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p $APP_PORT:$APP_PORT \
            $IMAGE_NAME:${{ needs.docker.outputs.image_tag }}


      # --------------------------------------------------------
      # Wait for application startup
      # --------------------------------------------------------

      - name: Wait for application
        run: |
          echo "Waiting for application..."

          sleep 5


      # --------------------------------------------------------
      # Verify Docker container
      # --------------------------------------------------------

      - name: Verify container
        run: |
          echo "=========================================="
          echo " Running Containers"
          echo "=========================================="

          docker ps \
            --filter "name=$CONTAINER_NAME"


      # --------------------------------------------------------
      # Show container logs
      # --------------------------------------------------------

      - name: Show container logs
        run: |
          echo "=========================================="
          echo " Application Logs"
          echo "=========================================="

          docker logs \
            --tail 50 \
            $CONTAINER_NAME


      # --------------------------------------------------------
      # Application health check
      # --------------------------------------------------------

      - name: Application health check
        run: |
          echo "Checking application health..."

          curl \
            --fail \
            --retry 10 \
            --retry-delay 2 \
            --connect-timeout 5 \
            http://localhost:$APP_PORT/health

          echo ""
          echo "=========================================="
          echo " Application is HEALTHY"
          echo "=========================================="


      # --------------------------------------------------------
      # Show deployed image
      # --------------------------------------------------------

      - name: Show deployed image
        run: |
          echo "=========================================="
          echo " Deployed Image"
          echo "=========================================="

          docker inspect \
            $CONTAINER_NAME \
            --format='{{.Config.Image}}'


      # --------------------------------------------------------
      # Show port mapping
      # --------------------------------------------------------

      - name: Show port mapping
        run: |
          echo "=========================================="
          echo " Port Mapping"
          echo "=========================================="

          docker port $CONTAINER_NAME


      # --------------------------------------------------------
      # Final verification
      # --------------------------------------------------------

      - name: Final verification
        run: |
          echo ""
          echo "=========================================="
          echo " DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo "Application:"
          echo "http://$(hostname -I | awk '{print $1}'):$APP_PORT"

          echo ""
          echo "Container:"
          docker ps --filter "name=$CONTAINER_NAME"

          echo ""
          echo "Health:"
          curl -s http://localhost:$APP_PORT/health

          echo ""
          echo "=========================================="
