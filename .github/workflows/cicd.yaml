name: Calculator CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: utkal1990/python-calculator
  NAMESPACE: python-calculator
  DEPLOYMENT: python-calculator
  CONTAINER_NAME: python-calculator

jobs:

  # ============================================================
  # CI - TEST
  # ============================================================

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  # ============================================================
  # CI - BUILD & PUSH
  # ============================================================

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${GITHUB_SHA::7} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push SHA image
        run: |
          docker push $IMAGE_NAME:${GITHUB_SHA::7}

      - name: Push latest image
        run: |
          docker push $IMAGE_NAME:latest


  # ============================================================
  # CD - DEPLOY TO KUBERNETES
  # ============================================================

  deploy:
    name: Deploy to Kubernetes
    needs: docker

    # IMPORTANT:
    # This runs on your GCP kubemaster self-hosted runner
    runs-on:
      - self-hosted
      - kubernetes
      - gcp

    # Deploy only when code is pushed to main.
    # Don't deploy for pull requests.
    if: github.event_name == 'push'

    steps:

      - name: Check Kubernetes cluster
        run: |
          kubectl get nodes

      - name: Deploy new image
        run: |
          kubectl -n $NAMESPACE \
            set image deployment/$DEPLOYMENT \
            $CONTAINER_NAME=$IMAGE_NAME:${{ needs.docker.outputs.image_tag }}

      - name: Wait for rollout
        run: |
          kubectl -n $NAMESPACE \
            rollout status deployment/$DEPLOYMENT \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl -n $NAMESPACE \
            get pods -o wide

      - name: Show deployed image
        run: |
          kubectl -n $NAMESPACE \
            get deployment $DEPLOYMENT \
            -o=jsonpath='{.spec.template.spec.containers[0].image}'

          echo
