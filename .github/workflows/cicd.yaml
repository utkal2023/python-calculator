name: Calculator CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: utkal1990/python-calculator
  NAMESPACE: python-calculator
  DEPLOYMENT: python-calculator
  CONTAINER_NAME: python-calculator

jobs:

  # ============================================================
  # CI - RUN TESTS
  # ============================================================

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  # ============================================================
  # CI - BUILD & PUSH DOCKER IMAGE
  # ============================================================

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${GITHUB_SHA::7} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push SHA image
        run: |
          docker push $IMAGE_NAME:${GITHUB_SHA::7}

      - name: Push latest image
        run: |
          docker push $IMAGE_NAME:latest


  # ============================================================
  # CD - DEPLOY TO KUBERNETES
  # ============================================================

  deploy:
    name: Deploy to Kubernetes
    needs: docker

    # Use your GCP Kubernetes master self-hosted runner
    runs-on: self-hosted

    # Deploy only for pushes to main
    # Pull requests will NOT deploy
    if: github.event_name == 'push'

    steps:

      # ----------------------------------------------------------
      # Checkout Kubernetes manifests
      # ----------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Check Kubernetes cluster
      # ----------------------------------------------------------

      - name: Check Kubernetes cluster
        run: |
          echo "Checking Kubernetes cluster..."
          kubectl get nodes -o wide


      # ----------------------------------------------------------
      # Create namespace
      # ----------------------------------------------------------

      - name: Create Kubernetes namespace
        run: |
          echo "Creating namespace if it does not exist..."
          kubectl apply -f k8s/namespace.yaml


      # ----------------------------------------------------------
      # Create / Update Deployment
      # ----------------------------------------------------------

      - name: Deploy application
        run: |
          echo "Applying Kubernetes Deployment..."
          kubectl apply -f k8s/deployment.yaml

          echo "Applying Kubernetes Service..."
          kubectl apply -f k8s/service.yaml


      # ----------------------------------------------------------
      # Update Deployment with immutable image tag
      # ----------------------------------------------------------

      - name: Update Docker image
        run: |
          echo "Deploying image:"
          echo "$IMAGE_NAME:${{ needs.docker.outputs.image_tag }}"

          kubectl -n $NAMESPACE \
            set image deployment/$DEPLOYMENT \
            $CONTAINER_NAME=$IMAGE_NAME:${{ needs.docker.outputs.image_tag }}


      # ----------------------------------------------------------
      # Wait for Kubernetes rollout
      # ----------------------------------------------------------

      - name: Wait for rollout
        run: |
          echo "Waiting for deployment rollout..."

          kubectl -n $NAMESPACE \
            rollout status deployment/$DEPLOYMENT \
            --timeout=180s


      # ----------------------------------------------------------
      # Verify Pods
      # ----------------------------------------------------------

      - name: Verify Pods
        run: |
          echo "Kubernetes Pods:"
          kubectl get pods \
            -n $NAMESPACE \
            -o wide


      # ----------------------------------------------------------
      # Verify Service
      # ----------------------------------------------------------

      - name: Verify Service
        run: |
          echo "Kubernetes Service:"
          kubectl get svc \
            -n $NAMESPACE


      # ----------------------------------------------------------
      # Show deployed image
      # ----------------------------------------------------------

      - name: Show deployed image
        run: |
          echo "Currently deployed image:"

          kubectl -n $NAMESPACE \
            get deployment $DEPLOYMENT \
            -o=jsonpath='{.spec.template.spec.containers[0].image}'

          echo


      # ----------------------------------------------------------
      # Final verification
      # ----------------------------------------------------------

      - name: Final deployment verification
        run: |
          echo "========================================="
          echo " Kubernetes Deployment Successful"
          echo "========================================="

          kubectl get deployment \
            -n $NAMESPACE

          kubectl get pods \
            -n $NAMESPACE \
            -o wide

          kubectl get svc \
            -n $NAMESPACE
